[namelist:transport]
adjust_vhv_wind=.false.
dep_pt_stencil_extent=2
equation_form=1,2,2,2
ffsl_unity_3d=.false.
horizontal_method=1,1,1,1
horizontal_monotone=1,1,1,1
min_val_abs_tol=-1e-9
min_val_max_iterations=10
min_val_method='iterative'
panel_edge_treatment='none'
reversible=.false.,.false.,.false.,.false.
theta_dispersion_correction=.false.
use_density_predictor=.true.
vertical_method=1,1,1,1
vertical_monotone=1,3,1,3
log_space=.false.,.false.,.false.,.false.

[namelist:mixed_solver]
si_tolerance=1.0e-3

[namelist:solver]
maximum_iterations=100
method='cg'
!!fail_on_non_converged=.true.
monitor_convergence=.true.

[namelist:timestepping]
alpha=0.5
