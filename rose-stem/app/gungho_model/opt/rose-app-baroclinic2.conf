[namelist:extrusion]
domain_height=30000.0
method='dcmip'
number_of_layers=30

[namelist:formulation]
shallow=.false.

[namelist:idealised]
test='deep_baroclinic_wave'

[namelist:initial_wind]
profile='deep_baroclinic_perturbed'

[namelist:io]
diagnostic_frequency=384

[namelist:mixed_solver]
si_tolerance=1.0e-3

[namelist:solver]
maximum_iterations=100
method='cg'
!!fail_on_non_converged=.true.
monitor_convergence=.true.

[namelist:timestepping]
alpha=0.5
